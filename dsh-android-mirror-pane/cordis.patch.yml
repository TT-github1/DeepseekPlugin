# dsh-android-mirror-pane 的 bundle patch：只插入一行插件，不动 profile 里的其它任何东西。
#
# 可选 config：
#   serial: '<serial>'        # 固定设备序列号；不写则用 ANDROID_SERIAL 或 adb devices 里第一个 online 设备
#   adb: '/path/to/adb'       # 指定 adb 可执行文件；不写则按 PATH 与 Android SDK 默认路径查找
#
# 预览面板（第三个 tab）的可选配置，全部有默认值，不写也能用：
#   preview.projectRoot: '/path/to/android/repo'   # 要扫 @Preview 的安卓项目；不写则按会话工作目录自动判定
#   preview.modules: ['feature/account/impl', ...] # 想锁死扫描范围时才写；不写则自动发现
#                                                  #   自动发现 = 解析 settings.gradle.kts + 扫 src 里的 @Preview，
#                                                  #   实测 40–140 毫秒；只有含 @Preview 的模块才会跑 Gradle
#   preview.androidCli: '~/.local/bin/android'     # Android CLI 路径；不写则依次找 ~/.local/bin、homebrew、PATH
#   preview.renderer: 'auto'                       # auto | headless | studio
#                                                  #   auto：Studio 开着且本项目 READY 时走 Studio（约 3 秒），否则 headless（约 5 秒）
#                                                  #   注意：声明了 productFlavors 的模块只能用 Studio——CLI 的
#                                                  #   headless 路径会硬编码找 `debug` 变体（实际叫 StandardDebug）而失败
#   preview.studioProject: 'Z3'                    # Studio 里打开的项目名；不写则按项目路径自动匹配
#
# 例：
#   - insert:
#       - id: android-mirror-pane
#         name: dsh-android-mirror-pane
#         config:
#           preview:
#             renderer: auto
- insert:
    - id: android-mirror-pane
      name: dsh-android-mirror-pane
